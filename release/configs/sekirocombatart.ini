; ============================================================
; Sekiro Combat Art Hotkey 配置文件
; 把整个 configs 文件夹和 dinput8.dll 放在 sekiro.exe 同目录。
; 修改本文件后需要重启游戏生效。
; ============================================================

[Hotkeys]
;支持的键位如下：
; 用键名直接写的（共约 104 个）

; 类别          支持    写法示例
; 字母          26 个   Q、e（不分大小写）
; 主键盘数字     10 个   1…9、0（单字符按主键盘键处理）
; 功能键   	    12 个   F5
; 编辑/导航键    16 个   SPACE TAB ENTER ESCAPE BACKSPACE DELETE 
; 编辑/导航键    16 个   INSERT HOME END PAGEUP PAGEDOWN LEFT RIGHT UP DOWN CAPSLOCK
; 修饰键          8 个   SHIFT LSHIFT RSHIFT CTRL LCTRL RCTRL ALT RALT，另加菜单键 MENU
; 鼠标           5 个   MB1-MB5（左右中键 + 两个侧键，MOUSE4 这类写法也认）
; 标点符号键   11 个   MINUS EQUAL COMMA PERIOD SLASH SEMICOLON 
; 标点符号键   11 个   APOSTROPHE LBRACKET RBRACKET BACKSLASH GRAVE（ 键）
; 小键盘   16 个   NUM0-NUM9、NUMPLUS NUMMINUS NUMMUL NUMDIV NUMENTER NUMLOCK
; 键名没覆盖的，用 VK 码兜底

; ini 里填多位十进制数会按 Windows 虚拟键码解释（1–254 都收）
; 所以像这些也能当热键：
; 44 = PrintScreen、145 = ScrollLock、19 = Pause
; 124–135 = F13–F24（部分键盘/虚拟键盘有）
; 多媒体键（播放暂停 179、音量 173/174/175 等）

; 也就是说理论上任意键盘按键都能配
; 只有少数特殊键（如 Win 键被系统拦截、鼠标滚轮不是按键）配不了或不建议配。
; 两个使用提醒：
; 数字写法有个小约定——单个字符 0-9 是主键盘数字键，
; 想表达 VK 码要用多位数字（如 81` = Q），不会出现歧义；
; 改完 ini 需要重启游戏才生效（配置在注入时只读一次）。

CombatArtKey = Q

; 设为 1 时，按住 Shift/Ctrl/Alt 期间本热键不触发（避免与其他 mod 或系统快捷键冲突）
; 设为 0（默认）时任何时候按下都触发
RequireNoModifier = 0
